port: 8080
max_in_flight: 300

compression:
  enabled: true
  min_bytes: 1024

rate_limit:
  backend: redis
  rate: 20
  burst: 30
  redis:
    addr: redis:6379

health_check:
  interval: 5s
  path: /healthz

circuit_breaker:
  max_failures: 3
  timeout: 10s

telemetry:
  metric_interval: 5s
  trace_batch_timeout: 5s
  log_batch_timeout: 1s

services:
  - name: catalog
    prefix: /catalog
    upstreams:
      - http://catalog:8080
      - http://catalog-2:8080
    auth: false
    cache:
      ttl: 60s
      max_entries: 1024
      max_bytes: 16777216

  - name: orders
    prefix: /orders
    upstreams:
      - http://orders:8080
      - http://orders-2:8080
    auth: true
    required_roles: [admin]
    rate_limit:
        rate: 5
        burst: 10
        key_by: jwt_sub
