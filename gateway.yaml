port: 8080
max_in_flight: 300

rate_limit:
  enabled: true
  backend: redis
  rate: 20
  burst: 30
  redis:
    addr: redis:6379

health_check:
  interval: 5s
  path: /healthz

circuit_breaker:
  enabled: true
  max_failures: 3
  timeout: 10s

services:
  - name: catalog
    prefix: /catalog
    upstreams:
      - http://catalog:8080
      - http://catalog-2:8080
    auth: false

  - name: orders
    prefix: /orders
    upstreams:
      - http://orders:8080
      - http://orders-2:8080
    auth: true
    rate_limit:
        rate: 5
        burst: 10                                                                                      
        key_by: jwt_sub
