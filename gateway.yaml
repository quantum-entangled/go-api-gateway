port: 8080

rate_limit:
  enabled: true
  rate: 10
  burst: 20
  cleanup_interval: 1m
  cleanup_max_idle: 3m

health_check:
  interval: 5s
  path: /healthz

circuit_breaker:
  enabled: true
  max_failures: 3
  timeout: 10s

services:
  - name: catalog
    prefix: /catalog
    upstreams:
      - http://catalog:8080
      - http://catalog-2:8080
    auth: false

  - name: orders
    prefix: /orders
    upstreams:
      - http://orders:8080
      - http://orders-2:8080
    auth: true
