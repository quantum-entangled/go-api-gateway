services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 2s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  service-a:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.25-alpine
        WORKDIR /app
        COPY go.mod ./
        COPY upstream/service-a/ ./upstream/service-a/
        CMD ["go", "run", "./upstream/service-a"]
    environment:
      PORT: "8080"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 5

  service-b:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.25-alpine
        WORKDIR /app
        COPY go.mod ./
        COPY upstream/service-b/ ./upstream/service-b/
        CMD ["go", "run", "./upstream/service-b"]
    environment:
      PORT: "8080"
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
