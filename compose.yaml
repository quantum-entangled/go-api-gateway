services:
  postgres:
    image: postgres:18.3-alpine
    command: [ "postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS}" ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 2s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8.6-alpine
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}" ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 2s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.25-alpine AS build
        RUN go install github.com/pressly/goose/v3/cmd/goose@latest
        FROM alpine:3.23
        COPY --from=build /go/bin/goose /usr/local/bin/goose
        WORKDIR /migrations
        COPY upstream/catalog/migrations/ ./catalog/
        COPY upstream/orders/migrations/ ./orders/
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    command: >
      sh -c "goose -dir /migrations/catalog -table goose_catalog postgres \"$$DATABASE_URL\" up &&
             goose -dir /migrations/orders  -table goose_orders  postgres \"$$DATABASE_URL\" up"
    depends_on:
      postgres:
        condition: service_healthy

  catalog:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.25-alpine AS build
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY upstream/catalog/ ./upstream/catalog/
        RUN go build -o /server ./upstream/catalog
        FROM alpine:3.23
        COPY --from=build /server /server
        CMD ["/server"]
    environment:
      PORT: ${CATALOG_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${CATALOG_PORT}/healthz || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 5

  orders:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.25-alpine AS build
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY upstream/orders/ ./upstream/orders/
        RUN go build -o /server ./upstream/orders
        FROM alpine:3.23
        COPY --from=build /server /server
        CMD ["/server"]
    environment:
      PORT: ${ORDERS_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${ORDERS_PORT}/healthz || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 5

  catalog-2:
    extends:
      service: catalog

  orders-2:
    extends:
      service: orders

  otel-lgtm:
    image: grafana/otel-lgtm:0.22.1
    ports:
      - "${GRAFANA_PORT}:3000"
      - "${OTEL_GRPC_PORT}:4317"
      - "${OTEL_HTTP_PORT}:4318"
    volumes:
      - otellgtmdata:/data
      - ./grafana/provisioning/dashboards/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./grafana/dashboards/gateway-overview.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/gateway-overview.json:ro
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: ${GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH}
    stop_grace_period: 1s
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/ready" ]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    volumes:
      - ./gateway.yaml:/etc/gateway/gateway.yaml:ro
      - ./dev.pem:/etc/gateway/dev.pem:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      JWT_PUBLIC_KEY_PATH: /etc/gateway/dev.pem
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: [ "-config", "/etc/gateway/gateway.yaml" ]
    depends_on:
      catalog:
        condition: service_healthy
      catalog-2:
        condition: service_healthy
      orders:
        condition: service_healthy
      orders-2:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${GATEWAY_PORT}/healthz || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  otellgtmdata:
