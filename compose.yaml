services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 2s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8.6-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 3s
      retries: 5

  service-a:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.25-alpine
        WORKDIR /app
        COPY go.mod ./
        COPY upstream/service-a/ ./upstream/service-a/
        RUN go build -o /server ./upstream/service-a
        CMD ["/server"]
    environment:
      PORT: ${UPSTREAM_A_PORT}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${UPSTREAM_A_PORT}/healthz || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 5

  service-b:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.25-alpine
        WORKDIR /app
        COPY go.mod ./
        COPY upstream/service-b/ ./upstream/service-b/
        RUN go build -o /server ./upstream/service-b
        CMD ["/server"]
    environment:
      PORT: ${UPSTREAM_B_PORT}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${UPSTREAM_B_PORT}/healthz || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 5

  otel-lgtm:
    image: grafana/otel-lgtm:0.22.1
    ports:
      - "${GRAFANA_PORT}:3000"
      - "${OTEL_GRPC_PORT}:4317"
      - "${OTEL_HTTP_PORT}:4318"
    volumes:
      - ./grafana/provisioning/dashboards/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./grafana/dashboards/gateway-overview.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/gateway-overview.json:ro
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: ${GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH}
    stop_grace_period: 1s
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/ready" ]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    volumes:
      - ./gateway.yaml:/etc/gateway/gateway.yaml:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    command: ["-config", "/etc/gateway/gateway.yaml"]
    depends_on:
      service-a:
        condition: service_healthy
      service-b:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${GATEWAY_PORT}/healthz || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
