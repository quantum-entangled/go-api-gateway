name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and load amd64 image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          load: true
          tags: gateway:smoke
          platforms: linux/amd64

      - name: Smoke test the prod image
        run: |
          docker network create smoke-net
          docker run -d --name smoke-upstream --network smoke-net nginx:alpine
          cat > smoke.yaml <<'EOF'
          port: 8080
          services:
            - name: example
              prefix: /example
              upstreams:
                - http://smoke-upstream:80
          health_check:
            interval: 1s
            path: /
          EOF
          docker run -d --name gateway-smoke --network smoke-net \
            -p 8080:8080 \
            -v "$(pwd)/smoke.yaml:/etc/gateway/gateway.yaml:ro" \
            gateway:smoke -config /etc/gateway/gateway.yaml
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/healthz; then
              echo "healthz OK"
              docker logs gateway-smoke
              docker rm -f gateway-smoke smoke-upstream
              docker network rm smoke-net
              exit 0
            fi
            sleep 1
          done
          echo "healthz never came up"
          docker logs gateway-smoke
          docker logs smoke-upstream
          docker rm -f gateway-smoke smoke-upstream
          docker network rm smoke-net
          exit 1

      - name: Build and push multi-arch prod image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          draft: true
